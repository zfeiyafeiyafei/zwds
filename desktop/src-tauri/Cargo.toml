[package]
name = "ziwei"
version = "0.1.0"
description = "Ziwei Doushu desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 减少调试构建体积：只保留行号级调试信息（不影响 backtrace，省空间明显）
# 增量编译在 dev profile 下默认开启，无需显式配置
[profile.dev]
debug = 1
